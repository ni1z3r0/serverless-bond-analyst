<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Asset Command</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f4f6f8; --card: #ffffff; --text: #1a1a1a; --green: #27ae60; --purple: #8e44ad; --blue: #2980b9; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        /* Layout */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; font-size: 1.1rem; color: #555; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        /* Report */
        .report-content { white-space: pre-wrap; font-family: 'Georgia', serif; font-size: 0.95rem; line-height: 1.6; }
        .report-content strong { color: #d35400; background: #fff4e6; padding: 0 4px; border-radius: 4px; }

        /* Metric Cards */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; }
        .fund-card { background: #fafbfc; border: 1px solid #eee; border-radius: 8px; padding: 15px; text-align: center; }
        .fund-card.bond { border-top: 4px solid var(--green); }
        .fund-card.equity { border-top: 4px solid var(--purple); }
        
        .ticker { font-weight: 900; font-size: 1.1rem; display: block; margin-bottom: 5px; }
        .big-val { font-size: 1.5rem; font-weight: 800; display: block; margin: 5px 0; }
        .bond .big-val { color: var(--green); } 
        .equity .big-val { color: var(--purple); }
        
        .stat-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: #666; margin-top: 3px; }
        
        /* Chart Containers */
        .chart-box { height: 250px; width: 100%; position: relative; }
    </style>
</head>
<body>

    <h1 style="color: #2c3e50;">🛡️ Multi-Asset Command Center</h1>
    
    <div class="dashboard-grid">
        <div class="card">
            <h2>🧠 AI Intelligence Brief</h2>
            <div id="ai-report" class="report-content" style="height: 300px; overflow-y: auto;">Loading intelligence...</div>
        </div>
        <div class="card">
            <h2>🎯 Bond Valuation (Yield vs Duration)</h2>
            <div class="chart-box">
                <canvas id="scatterChart"></canvas>
            </div>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <h2 style="color: var(--green);">📈 Bond Momentum (1 Year)</h2>
            <div class="chart-box"><canvas id="bondChart"></canvas></div>
        </div>
        <div class="card">
            <h2 style="color: var(--purple);">📈 Equity Momentum (1 Year)</h2>
            <div class="chart-box"><canvas id="equityChart"></canvas></div>
        </div>
    </div>

    <div class="card">
        <h2>📊 Live Portfolio Metrics</h2>
        <div id="fund-container" class="metrics-grid"></div>
    </div>

    <script>
        // --- CONFIG ---
       // TODO: Replace with your actual S3 bucket domain (e.g., your-bucket.s3.amazonaws.com)
        const BUCKET_DOMAIN = "YOUR_S3_BUCKET_NAME.s3.amazonaws.com";
        
        // Manual Lists ensures charts group correctly even if data is partial
        const BONDS = ["HYG", "LQD", "CEMB", "USIG", "IEI"];
        const EQUITIES = ["EEM", "IWD", "IWM", "IVV"];
        const ALL = [...BONDS, ...EQUITIES];
        
        const today = new Date().toISOString().split('T')[0];

        // 1. Load AI Report
        fetch(`https://${BUCKET_DOMAIN}/reports/ai_analysis_${today}.txt`)
            .then(r => r.text())
            .then(t => document.getElementById('ai-report').innerHTML = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'))
            .catch(e => document.getElementById('ai-report').innerHTML = "Report pending.");

        // 2. Load Fund Cards
        const grid = document.getElementById('fund-container');
        ALL.forEach(async t => {
            try {
                const res = await fetch(`https://${BUCKET_DOMAIN}/data/${t}_${today}.json`);
                if(!res.ok) return;
                const d = await res.json();
                
                let html = "";
                if(d.Type === 'equity' || d.PE_Ratio) {
                    html = `
                    <div class="fund-card equity">
                        <span class="ticker">${t}</span>
                        <span class="big-val">${d.PE_Ratio}x <small>P/E</small></span>
                        <div class="stat-row"><span>Beta:</span> <b>${d.Beta}</b></div>
                        <div class="stat-row"><span>Div:</span> <b>${d.Div_Yield}%</b></div>
                        <div class="stat-row"><span>P/B:</span> <b>${d.Price_Book}</b></div>
                    </div>`;
                } else {
                    html = `
                    <div class="fund-card bond">
                        <span class="ticker">${t}</span>
                        <span class="big-val">${d.Yield}% <small>Yld</small></span>
                        <div class="stat-row"><span>Dur:</span> <b>${d.Duration}y</b></div>
                        <div class="stat-row"><span>OAS:</span> <b>${d.OAS}</b></div>
                        <div class="stat-row"><span>Mat:</span> <b>${d.Maturity}y</b></div>
                    </div>`;
                }
                grid.innerHTML += html;
            } catch(e) {}
        });

        // 3. Load Charts
        // Helper for colors
        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#34495e'];

        // A. SCATTER CHART (Bonds)
        fetch(`https://${BUCKET_DOMAIN}/dashboard_data.json`).then(r=>r.json()).then(d => {
            const pts = d.scatter_points.map(p => ({x: p.Duration, y: p.Yield, label: p.Ticker}));
            new Chart(document.getElementById('scatterChart'), {
                type: 'scatter',
                data: { datasets: [{ label: 'Bonds', data: pts, backgroundColor: '#27ae60' }] },
                options: { plugins: { tooltip: { callbacks: { label: c => `${c.raw.label}: ${c.raw.y}%` } } } }
            });
        });

        // B. HISTORY CHARTS
        fetch(`https://${BUCKET_DOMAIN}/dashboard_history.json`).then(r=>r.json()).then(d => {
            
            // Helper to build datasets
            const getSets = (tickers) => tickers.map((t, i) => {
                const prices = d[t] || [];
                if(!prices.length) return null;
                const base = prices[0].price;
                return {
                    label: t,
                    data: prices.map(p => ({x: p.date, y: ((p.price-base)/base)*100})),
                    borderColor: colors[i % colors.length],
                    borderWidth: 2, pointRadius: 0, tension: 0.1
                };
            }).filter(x=>x);

            // Bond Chart
            new Chart(document.getElementById('bondChart'), {
                type: 'line',
                data: { datasets: getSets(BONDS) },
                options: { interaction: { mode: 'index', intersect: false } }
            });

            // Equity Chart
            new Chart(document.getElementById('equityChart'), {
                type: 'line',
                data: { datasets: getSets(EQUITIES) },
                options: { interaction: { mode: 'index', intersect: false } }
            });
        });
    </script>
</body>
</html>
