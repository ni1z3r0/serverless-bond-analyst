<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi-Asset Command</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.0/dist/purify.min.js"></script>
    <style>
        :root { --bg: #f4f6f8; --card: #ffffff; --text: #1a1a1a; --green: #27ae60; --purple: #8e44ad; --blue: #2980b9; --orange: #e67e22; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; max-width: 1400px; margin: 0 auto; }
        
        /* Layout */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; font-size: 1.1rem; color: #555; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        /* Tabs */
        .tab-container { display: flex; border-bottom: 1px solid #eee; margin-bottom: 15px; }
        .tab { padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; color: #888; font-weight: 600; font-size: 0.9rem; }
        .tab.active { border-bottom: 2px solid var(--blue); color: var(--blue); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Report Text */
        .report-content { white-space: pre-wrap; font-family: 'Georgia', serif; font-size: 0.95rem; line-height: 1.6; height: 320px; overflow-y: auto; }
        .report-content strong { color: #d35400; background: #fff4e6; padding: 0 4px; border-radius: 4px; }

        /* Metric Cards & Charts */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; }
        
        /* UPDATED CARD CSS: Taller & Flexbox for better spacing */
        .fund-card { 
            background: #fafbfc; 
            border: 1px solid #eee; 
            border-radius: 8px; 
            padding: 15px; 
            text-align: center; 
            min-height: 180px; /* Fixed height to fit all data rows */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .fund-card.bond { border-top: 4px solid var(--green); }
        .fund-card.equity { border-top: 4px solid var(--purple); }
        .fund-card.sector { border-top: 4px solid var(--orange); }
        
        .ticker { font-weight: 900; font-size: 1.1rem; }
        .big-val { font-size: 1.4rem; font-weight: 800; display: block; margin: 5px 0; }
        .stat-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: #666; margin-top: 3px; }
        
        .chart-box { height: 280px; width: 100%; position: relative; }
    </style>
    <script>
        // --- COGNITO CONFIGURATION ---
        // 1. DOMAIN: Found in User Pool > App Integration > Domain name
        const COGNITO_DOMAIN = "https://bond-analyst-rcampos.auth.us-east-1.amazoncognito.com"; 
        
        // 2. CLIENT ID: Found in User Pool > App Integration > App client list
        const CLIENT_ID = "2hal73i1fbnr44n2mjkg8j2h8m"; 
        
        // 3. REDIRECT: Must match your CloudFront URL exactly (HTTPS)
        const REDIRECT_URI = "https://d269ewi535s8ar.cloudfront.net/index.html";

        // --- AUTHENTICATION LOGIC ---
        
        // A. Check if we are coming back from a login (URL has #id_token=...)
        const hash = window.location.hash;
        if (hash && hash.includes("id_token")) {
            const params = new URLSearchParams(hash.replace("#", "?"));
            const token = params.get("id_token");
            if (token) {
                // Save the "Entry Ticket" to the browser's pocket (Session Storage)
                sessionStorage.setItem("bond_auth_token", token);
                // Clean the URL (remove the ugly token from the address bar)
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // B. Check if the user has a ticket in their pocket
        const token = sessionStorage.getItem("bond_auth_token");
        
        if (!token) {
            // C. NO TICKET? KICK THEM OUT!
            // Redirect to the AWS Login Page
            const loginUrl = `${COGNITO_DOMAIN}/login?client_id=${CLIENT_ID}&response_type=token&scope=email+openid&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
            window.location.href = loginUrl;
        }
    </script>
</head>
<body>

    <h1 style="color: #2c3e50;">🛡️ Multi-Asset Command Center</h1>
    
    <div class="dashboard-grid">
        <div class="card">
            <div class="tab-container">
                <div class="tab active" onclick="switchTab('memo')">🧠 Market Memo</div>
                <div class="tab" onclick="switchTab('sector')">🏗️ Sector Deep Dive</div>
            </div>
            
            <div id="memo-content" class="tab-content active report-content">Loading Macro Intelligence...</div>
            <div id="sector-content" class="tab-content report-content">Loading Sector Analysis...</div>
        </div>

        <div class="card">
            <h2>🎯 Bond Valuation (Yield vs Duration)</h2>
            <div class="chart-box"><canvas id="scatterChart"></canvas></div>
        </div>
    </div>

    <div class="dashboard-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="card">
            <h2 style="color: var(--green);">📈 Bonds (1Y)</h2>
            <div class="chart-box"><canvas id="bondChart"></canvas></div>
        </div>
        <div class="card">
            <h2 style="color: var(--purple);">📈 Equities (1Y)</h2>
            <div class="chart-box"><canvas id="equityChart"></canvas></div>
        </div>
        <div class="card">
            <h2 style="color: var(--orange);">🏗️ Sectors (1Y)</h2>
            <div class="chart-box"><canvas id="sectorChart"></canvas></div>
        </div>
    </div>

    <div class="card">
        <h2>📊 Live Portfolio Metrics</h2>
        <div id="fund-container" class="metrics-grid"></div>
    </div>

    <script>
        // CONFIG
        const BUCKET_DOMAIN = "YOURBUCKET.s3.amazonaws.com"; // TO DO: CHANGE TO Your Bucket NAME
        const today = new Date().toISOString().split('T')[0];

        // ASSET LISTS
        const BONDS = ["HYG", "LQD", "IEI", "USIG", "CEMB"];
        const EQUITIES = ["IWM", "EEM", "IVV", "IWD"];
        const SECTORS = ["IYW", "IYF", "IYE", "IYH"];
        const ALL = [...BONDS, ...EQUITIES, ...SECTORS];

        // 1. Load AI Report
        fetch(`https://${BUCKET_DOMAIN}/reports/ai_analysis_${today}.json`)
            .then(r => r.json())
            .then(d => {
                const fmt = (t) => DOMPurify.sanitize(t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'));
                document.getElementById('memo-content').innerHTML = fmt(d.market_memo);
                document.getElementById('sector-content').innerHTML = fmt(d.sector_analysis);
            })
            .catch(e => {
                document.getElementById('memo-content').innerHTML = "Report pending for today.";
                document.getElementById('sector-content').innerHTML = "No sector data yet.";
            });

        // 2. Load Charts (History)
        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6'];
        
        fetch(`https://${BUCKET_DOMAIN}/dashboard_history.json`)
            .then(r => r.json())
            .then(d => {
                const getSets = (tickers) => tickers.map((t, i) => {
                    const prices = d[t] || [];
                    if (!prices.length) return null;
                    const base = prices[0].price;
                    return {
                        label: t,
                        data: prices.map(p => ({x: p.date, y: ((p.price-base)/base)*100})),
                        borderColor: colors[i % colors.length],
                        borderWidth: 2, pointRadius: 0, tension: 0.1
                    };
                }).filter(x=>x);

                new Chart(document.getElementById('bondChart'), { type: 'line', data: { datasets: getSets(BONDS) } });
                new Chart(document.getElementById('equityChart'), { type: 'line', data: { datasets: getSets(EQUITIES) } });
                new Chart(document.getElementById('sectorChart'), { type: 'line', data: { datasets: getSets(SECTORS) } });
            });

// 3. Scatter Chart (with Regression Line)
        fetch(`https://${BUCKET_DOMAIN}/dashboard_data.json`)
            .then(r => { 
                if (!r.ok) throw new Error(`HTTP ${r.status}`); 
                return r.json(); 
            })
            .then(d => {
                // 1. Prepare Dots (Bonds)
                const plotPoints = d.scatter_points.map(p => ({
                    x: p.Duration, 
                    y: p.Yield,
                    label: p.Ticker 
                }));

                // 2. Prepare Regression Line (Fair Value)
                // y = mx + b
                const slope = d.regression.slope;
                const intercept = d.regression.intercept;
                
                // Calculate start (x=0) and end (x=10) for the line
                const linePoints = [
                    { x: 0, y: intercept },
                    { x: 10, y: slope * 10 + intercept }
                ];

                new Chart(document.getElementById('scatterChart'), {
                    type: 'scatter',
                    data: {
                        datasets: [
                            {
                                label: 'Fair Value',
                                data: linePoints,
                                type: 'line', // Draws the regression line
                                borderColor: '#e74c3c',
                                borderWidth: 2,
                                pointRadius: 0, 
                                borderDash: [5, 5] // Dashed style
                            },
                            {
                                label: 'Bonds',
                                data: plotPoints,
                                backgroundColor: '#2980b9',
                                pointRadius: 6
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { title: {display:true, text:'Duration (Years)'}, type: 'linear', position: 'bottom' },
                            y: { title: {display:true, text:'Yield (%)'} }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(ctx) {
                                        if(ctx.dataset.type === 'line') return ''; // No tooltip for the line
                                        const p = ctx.raw;
                                        return `${p.label}: ${p.y}% Yield`;
                                    }
                                }
                            }
                        }
                    }
                });
            })
            .catch(e => {
                console.error('Scatter chart data error:', e);
                // Optional: Show error on the card if data fails
                // document.getElementById('scatterChart').parentElement.innerHTML = '<p style="color: #e74c3c;">Failed to load chart.</p>';
            });

        // 4. Fund Cards (Now with Hyperlinks)
        const grid = document.getElementById('fund-container');
        
        const FUND_NAMES = {
            "HYG": "High Yield Corp Bond",
            "LQD": "Inv Grade Corp Bond",
            "IEI": "3-7 Year Treasury",
            "USIG": "Broad USD Inv Grade",
            "CEMB": "Emerging Market Corp",
            "IWM": "Russell 2000 (Small Cap)",
            "EEM": "MSCI Emerging Markets",
            "IVV": "Core S&P 500",
            "IWD": "Russell 1000 Value",
            "IYW": "U.S. Technology",
            "IYF": "U.S. Financials",
            "IYE": "U.S. Energy",
            "IYH": "U.S. Healthcare"
        };

        ALL.forEach(async t => {
            try {
                const res = await fetch(`https://${BUCKET_DOMAIN}/data/${t}_${today}.json`);
                if(!res.ok) return;
                const d = await res.json();
                
                const price = d.Price && d.Price !== "N/A" ? `$${d.Price}` : "";
                const fullName = FUND_NAMES[t] || t; 
                
                // --- LINK LOGIC ---
                // Use the scraped URL, or fallback to Yahoo Finance if missing
                const sourceLink = d.SourceURL || `https://finance.yahoo.com/quote/${t}`;
                
                let typeClass = 'equity';
                if(SECTORS.includes(t)) typeClass = 'sector';
                if(BONDS.includes(t)) typeClass = 'bond';

                let html = "";
                
                // Common Header with Link
                const headerHtml = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
                        <a href="${sourceLink}" target="_blank" title="View Source Data" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:4px;">
                            <span class="ticker" style="border-bottom: 1px dotted #999;">${t}</span>
                            <span style="font-size:0.8rem;">🔗</span>
                        </a>
                        <span style="font-weight:bold; color:#666;">${price}</span>
                    </div>
                    <div style="font-size:0.8rem; color:#888; margin-bottom:8px; font-style:italic; height:30px; overflow:hidden; text-overflow:ellipsis;">
                        ${fullName}
                    </div>`;

                if (typeClass === 'bond') {
                    html = `
                    <div class="fund-card bond">
                        ${headerHtml}
                        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding-bottom:5px; margin-bottom:5px;">
                            <span style="color:var(--green); font-weight:800;">${d.Yield}% <small>SEC</small></span>
                            <span style="color:#555; font-weight:600;">${d.YTM || '-'}% <small>YTM</small></span>
                        </div>
                        <div class="stat-row"><span>Duration:</span> <b>${d.Duration} yrs</b></div>
                        <div class="stat-row"><span>Convexity:</span> <b>${d.Convexity || '-'}</b></div>
                        <div class="stat-row"><span>Coupon:</span> <b>${d.Coupon || '-'}%</b></div>
                        <div class="stat-row"><span>OAS:</span> <b>${d.OAS} bps</b></div>
                    </div>`;
                } else {
                    html = `
                    <div class="fund-card ${typeClass}">
                        ${headerHtml}
                        <span class="big-val">${d.PE_Ratio}x <small>P/E</small></span>
                        <div class="stat-row"><span>Beta (3y):</span> <b>${d.Beta}</b></div>
                        <div class="stat-row"><span>Std Dev:</span> <b>${d.Std_Dev || '-'}%</b></div>
                        <div class="stat-row"><span>Div Yield:</span> <b>${d.Div_Yield || 'N/A'}%</b></div>
                        <div class="stat-row"><span>P/B Ratio:</span> <b>${d.Price_Book}</b></div>
                    </div>`;
                }

                grid.innerHTML += html;
            } catch(e) {}
        });

        // Tab Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName + '-content').classList.add('active');
        }
    </script>
</body>
</html>
