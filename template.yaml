AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Step 1 - BondAnalyst only

Parameters:
  BucketName:
    Type: String
    Default: "bond-dashboard-rc11292025"
  OpenAIApiKey:
    Type: String
    NoEcho: true
  FredApiKey:
    Type: String
    NoEcho: true
    Default: ""
  SqsQueueUrl:
    Type: String
  SqsQueueArn:
    Type: String
  TargetEmail:
    Type: String
  SenderEmail:
    Type: String
    Description: Verified SES email for sending notifications.

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        BUCKET_NAME: !Ref BucketName
        OPENAI_API_KEY: !Ref OpenAIApiKey
        FRED_API_KEY: !Ref FredApiKey

Resources:
  BondAnalyst:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./functions/analyst
      Handler: lambda_function.lambda_handler
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref SqsQueueUrl
          TARGET_EMAIL: !Ref TargetEmail
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BucketName
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !Ref SqsQueueArn

  BondDataScraper:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./functions/scraper
      Handler: lambda_function.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BucketName
      Events:
        DailyScrape:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)

  ChatAnalyst:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./functions/chat
      Handler: lambda_function.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          GPT_MODEL: "gpt-4o"
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref BucketName

  EmailForwarder:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./functions/mailer
      Handler: lambda_function.lambda_handler
      Runtime: python3.10
      Timeout: 30 # Must be <= SQS queue visibility timeout (30s)
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          TARGET_EMAIL: !Ref TargetEmail
      Policies:
        - SESCrudPolicy:
            IdentityName: !Ref SenderEmail
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !Ref SqsQueueArn
            BatchSize: 10

  # --- MONITORING & ALERTS ---
  SystemAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-SystemAlerts"

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref TargetEmail
      Protocol: email
      TopicArn: !Ref SystemAlertsTopic

  # 1. OpenAI Alerts
  BondAnalystLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${BondAnalyst}"
      RetentionInDays: 7

  OpenAIMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: BondAnalystLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${BondAnalyst}"
      FilterPattern: '"[ALERT:OpenAI]"'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "BondAnalyst/Errors"
          MetricName: "OpenAIFailures"

  OpenAIAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Triggered if OpenAI fails (Key/Quota/Rate)"
      MetricName: "OpenAIFailures"
      Namespace: "BondAnalyst/Errors"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SystemAlertsTopic

  # 2. Data Fetch Alerts
  DataFetchMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: BondAnalystLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${BondAnalyst}" # Analyst fetches FRED/Yahoo
      FilterPattern: '"[ALERT:DataFetch]"'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "BondAnalyst/Errors"
          MetricName: "DataFetchFailures"

  DataFetchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Triggered if yfinance or FRED fails"
      MetricName: "DataFetchFailures"
      Namespace: "BondAnalyst/Errors"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SystemAlertsTopic

  # 3. Critical Errors (Scraper)
  # Scraper runs separately, so we check its logs too
  BondDataScraperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${BondDataScraper}"
      RetentionInDays: 7

  ScraperCriticalFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: BondDataScraperLogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${BondDataScraper}"
      FilterPattern: '"[ALERT:Critical]"'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "BondAnalyst/Errors"
          MetricName: "ScraperCriticalErrors"

  ScraperCriticalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Triggered if Scraper crashes or fails critically"
      MetricName: "ScraperCriticalErrors"
      Namespace: "BondAnalyst/Errors"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SystemAlertsTopic
