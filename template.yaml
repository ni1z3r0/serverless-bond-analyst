AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Step 1 - BondAnalyst only

Parameters:
  BucketName:
    Type: String
    Default: "bond-dashboard-rc11292025"
  OpenAIApiKey:
    Type: String
    NoEcho: true
  SqsQueueUrl:
    Type: String
  SqsQueueArn:
    Type: String
  TargetEmail:
    Type: String
  SenderEmail:
    Type: String
    Description: Verified SES email for sending notifications.

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        BUCKET_NAME: !Ref BucketName
        OPENAI_API_KEY: !Ref OpenAIApiKey

Resources:
  BondAnalyst:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./functions/analyst
      Handler: lambda_function.lambda_handler
      Timeout: 120
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref SqsQueueUrl
          TARGET_EMAIL: !Ref TargetEmail
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BucketName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !Ref SqsQueueArn

  BondDataScraper:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./functions/scraper
      Handler: lambda_function.lambda_handler
      Timeout: 300
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BucketName
      Events:
        DailyScrape:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)

  ChatAnalyst:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./functions/chat
      Handler: lambda_function.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          GPT_MODEL: "gpt-4o"
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref BucketName

  EmailForwarder:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./functions/mailer
      Handler: lambda_function.lambda_handler
      Runtime: python3.10
      Timeout: 30  # Must be <= SQS queue visibility timeout (30s)
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          TARGET_EMAIL: !Ref TargetEmail
      Policies:
        - SESCrudPolicy:
            IdentityName: !Ref SenderEmail
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !Ref SqsQueueArn
            BatchSize: 10
